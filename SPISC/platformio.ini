; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ── Configuración común ───────────────────────────
[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags = -I include

; ── Firmware principal (orquestador modular) ──────
[env:esp32dev]
extends = common
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    robtillaart/AS5600
build_src_filter = +<*> -<rango_pwm.cpp> -<neural_control.cpp> -<test_connectivity.cpp>

; ── Test de conectividad WiFi+MQTT ────────────────
[env:test_connectivity]
extends = common
lib_deps =
    knolleary/PubSubClient@^2.8
build_src_filter = -<*> +<test_connectivity.cpp>

; ── Barrido de rango operativo PWM ────────────────
[env:rango_pwm]
extends = common
lib_deps =
    knolleary/PubSubClient@^2.8
build_src_filter = -<*> +<rango_pwm.cpp>
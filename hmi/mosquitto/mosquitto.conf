# Mosquitto MQTT Broker — Péndulo Invertido HMI
# Uso: mosquitto -c hmi/mosquitto/mosquitto.conf -v

# ── Listener ──────────────────────────────────────
listener 1883
protocol mqtt

# ── Autenticación ─────────────────────────────────
# Red local de desarrollo — sin autenticación
allow_anonymous true

# ── Logging ───────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# ── Persistencia ──────────────────────────────────
persistence false

# ── Rendimiento ───────────────────────────────────
max_inflight_messages 50
max_queued_messages 1000

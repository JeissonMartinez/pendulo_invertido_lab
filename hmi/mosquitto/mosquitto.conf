# Mosquitto MQTT Broker — Péndulo Invertido HMI
# Uso: mosquitto -c hmi/mosquitto/mosquitto.conf -v

# ══════════════════════════════════════════════════
# Configuración para ESP32 Access Point
# ══════════════════════════════════════════════════

# Escuchar en TODAS las interfaces de red
# Necesario para recibir conexiones desde la red del AP (192.168.4.x)
listener 1883 0.0.0.0
protocol mqtt

# ── Autenticación ─────────────────────────────────
# Red local de desarrollo — sin autenticación
allow_anonymous true

# ── Logging ───────────────────────────────────────
log_dest stdout
log_type all
connection_messages true
log_timestamp true

# ── Persistencia ──────────────────────────────────
persistence true
persistence_location /tmp/mosquitto/

# ── Rendimiento ───────────────────────────────────
max_inflight_messages 50
max_queued_messages 1000

# Tamaño máximo de mensaje (1MB)
message_size_limit 1048576
